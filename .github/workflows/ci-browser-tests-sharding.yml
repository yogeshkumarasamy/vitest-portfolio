# ============================================================================
# CI Browser Tests - Sharded Execution
# ============================================================================
# Purpose: Execute 245 browser tests across 39 suites in parallel shards
# Strategy: 4-way sharding for optimal GitHub runner utilization
# Reporter: Blob format for distributed execution + merge step
# Architecture: Principal Engineer standard for FAANG-level CI
# ============================================================================

name: CI - Browser Tests (Sharded)

# ============================================================================
# Trigger Configuration
# ============================================================================
on:
  pull_request:
  push:
    branches:
      - main

# ============================================================================
# Concurrency Control
# ============================================================================
# Cancel in-progress runs on new commits to same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================================================
# Jobs
# ============================================================================
jobs:
  # --------------------------------------------------------------------------
  # Job 1: Sharded Browser Tests
  # --------------------------------------------------------------------------
  # Executes tests across 4 parallel shards
  # Each shard runs ~61 tests (245/4) in isolated browser environment
  # --------------------------------------------------------------------------
  tests:
    name: Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Fail fast disabled - see all shard results even if one fails
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      # ------------------------------------------------------------------------
      # Step 1: Checkout Repository
      # ------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # Step 2: Setup pnpm
      # ------------------------------------------------------------------------
      # MUST run before setup-node to enable pnpm cache detection
      # Version read from package.json "packageManager" field
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # ------------------------------------------------------------------------
      # Step 3: Setup Node.js
      # ------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ------------------------------------------------------------------------
      # Step 4: Get pnpm Store Path (for caching)
      # ------------------------------------------------------------------------
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------------
      # Step 5: Cache pnpm Dependencies
      # ------------------------------------------------------------------------
      # Dramatically reduces install time on subsequent runs
      # Invalidates when pnpm-lock.yaml changes
      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ------------------------------------------------------------------------
      # Step 6: Install Dependencies
      # ------------------------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------------
      # Step 7: Cache Playwright Browsers
      # ------------------------------------------------------------------------
      # Chromium binary is ~200MB - caching saves 30-40s per run
      # Key includes Playwright version to invalidate when upgrading
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # ------------------------------------------------------------------------
      # Step 8: Install Playwright Browsers (if not cached)
      # ------------------------------------------------------------------------
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run:
          pnpm --filter portfolio exec playwright install --with-deps chromium

      # ------------------------------------------------------------------------
      # Step 9: Install System Dependencies (always run)
      # ------------------------------------------------------------------------
      # Even with cached browsers, system deps might be missing
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter portfolio exec playwright install-deps chromium

      # ------------------------------------------------------------------------
      # Step 10: Run Sharded Browser Tests
      # ------------------------------------------------------------------------
      # Each shard runs a subset of tests with blob reporter
      # Blob format enables distributed execution + centralized merge
      #
      # Why blob reporter?
      # - Efficient binary format for CI
      # - Supports distributed execution
      # - Enables post-merge analysis
      # - Minimal output during run (faster)
      #
      # Sharding strategy:
      # - Vitest automatically distributes test files across shards
      # - Each shard gets ~10 test files (39 suites / 4 shards)
      # - Tests run in headless Chromium
      # - maxWorkers auto-detected (GitHub runners have 2 cores)
      - name:
          Run tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: |
          pnpm --filter portfolio exec vitest \
            --run \
            --reporter=blob \
            --browser.headless=true \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true

      # ------------------------------------------------------------------------
      # Step 11: Upload Blob Reports
      # ------------------------------------------------------------------------
      # Upload even if tests fail (!cancelled ensures upload unless user cancels)
      # Each shard produces a separate blob artifact
      # Artifacts are merged in the next job
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: apps/portfolio/.vitest-reports
          include-hidden-files: true
          retention-days: 1

  # --------------------------------------------------------------------------
  # Job 2: Merge Shard Reports
  # --------------------------------------------------------------------------
  # Combines blob reports from all shards into unified output
  # Runs even if some shards fail (unless workflow cancelled)
  # Produces final test results in human-readable format
  # --------------------------------------------------------------------------
  merge-reports:
    name: Merge Test Reports
    if: ${{ !cancelled() }}
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ------------------------------------------------------------------------
      # Step 1: Checkout Repository
      # ------------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # ------------------------------------------------------------------------
      # Step 2: Setup pnpm
      # ------------------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      # ------------------------------------------------------------------------
      # Step 3: Setup Node.js
      # ------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ------------------------------------------------------------------------
      # Step 4: Install Dependencies
      # ------------------------------------------------------------------------
      # Only need Vitest for merging reports - no browser dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------------
      # Step 5: Download All Blob Reports
      # ------------------------------------------------------------------------
      # Downloads artifacts from all 4 shards
      # Pattern matches: blob-report-1, blob-report-2, blob-report-3, blob-report-4
      # merge-multiple: true combines them into single directory
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: apps/portfolio/.vitest-reports
          pattern: blob-report-*
          merge-multiple: true

      # ------------------------------------------------------------------------
      # Step 6: Merge Reports into Final Output
      # ------------------------------------------------------------------------
      # Combines all shard results into unified test report
      #
      # Reporters:
      # - json: Machine-readable format for CI integrations
      # - dot: Human-readable summary in logs
      #
      # Output files:
      # - merged-test-report.json: Full test results with timing data
      # - Can be consumed by coverage tools, dashboards, etc.
      - name: Merge reports
        run: |
          pnpm --filter portfolio exec vitest run \
            --merge-reports \
            --reporter=dot \
            --reporter=json \
            --outputFile=test-results/merged-test-report.json

      # ------------------------------------------------------------------------
      # Step 7: Upload Merged Report
      # ------------------------------------------------------------------------
      # Final artifact with complete test results from all shards
      # Retained for 7 days for historical analysis
      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-results
          path: apps/portfolio/test-results/
          retention-days: 7
